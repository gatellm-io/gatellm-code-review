# Example: invoking Claude Auto Review as a Reusable Workflow (supports multi-model)
# Drop this file into the caller repo's .github/workflows/pr-review.yml to use.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    uses: gatellm-io/gatellm-code-review/.github/workflows/claude-auto-review.yml@v1
    secrets: inherit   # lets CODE_REVIEW_API_KEY pass through to the reusable workflow
    with:
      runs_on: "self-hosted, Linux, fargate-runner"

      # — Single-model mode (default) —
      # Leave `models` empty; uses `model` for single-model review, output is posted directly as a PR comment
      # model: deepseek-v4-pro

      # — Multi-model mode —
      # Pass ≥2 models to enable parallel review + summary; max 3, extras truncated
      # models: "deepseek-v4-pro,claude-sonnet-4,glm-4-plus"
      # summary_model: "claude-sonnet-4"   # empty takes the first of `models`

      # — Common params (all have defaults; override as needed) —
      # max_lines: 10000
      # user_request: ""
      # review_language: "English"   # Default English; empty/unsupported value falls back to English; pass "Simplified Chinese" for Chinese
      # prompt: |
      #   Custom review prompt...
