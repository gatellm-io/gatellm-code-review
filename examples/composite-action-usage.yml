# Example: invoking Claude Auto Review as a Composite Action (single-model variant)
# Drop this file into the caller repo's .github/workflows/pr-review.yml to use.
#
# Note: the composite action only supports single-model review; output is posted directly as a PR comment.
# For multi-model parallel review + summary, use examples/reusable-workflow-usage.yml.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '@claude'))
    # Runner is chosen by the caller; self-hosted reuses the preinstalled Claude CLI, ubuntu-latest auto-installs as fallback
    runs-on: [self-hosted, Linux, fargate-runner]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    concurrency:
      # Separate groups per event so an @claude follow-up does not cancel the push-triggered review.
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Auto Review (single model)
        uses: gatellm-io/gatellm-code-review@v1
        with:
          # Credentials: default to the caller repo's same-named secret/var, no need to pass explicitly
          # Override if pointing to a different secret/var
          anthropic_api_key: ${{ secrets.CODE_REVIEW_API_KEY }}
          anthropic_base_url: ${{ vars.CODE_REVIEW_BASE_URL }}

          # Business params (all have defaults; override as needed)
          # model: deepseek-v4-pro
          # max_lines: 10000
          # user_request: ""
          # review_language: "English"   # Default English; empty/unsupported value falls back to English; pass "Simplified Chinese" for Chinese
          # prompt: |
          #   Custom review prompt...
