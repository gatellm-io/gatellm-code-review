name: Claude Auto Review

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label(s). Comma-separated string like 'self-hosted, Linux, fargate-runner' or a single label like 'ubuntu-latest'. Applied to setup/review/summarize jobs."
        required: true
        type: string
      model:
        description: "Single model name (backward compatible; used when models is empty, defaults to deepseek-v4-pro)"
        required: false
        type: string
        default: ${{ vars.CODE_REVIEW_MODEL }}
      models:
        description: "Comma-separated model list (≥2 enables multi-model parallel review + summary; empty falls back to single-model mode; max 3, extras truncated)"
        required: false
        type: string
        default: ${{ vars.CODE_REVIEW_MODELS }}
      summary_model:
        description: "Summary model name (used in multi-model mode; empty takes the first of models)"
        required: false
        type: string
        default: ${{ vars.CODE_REVIEW_SUMMARY_MODEL }}
      max_lines:
        description: "Max PR changed lines; skip review if exceeded (-1 means unlimited, default 10000)"
        required: false
        type: number
        default: 10000
      user_request:
        description: "User request content when triggered by @claude comment (optional)"
        required: false
        type: string
        default: ""
      review_language:
        description: "Review comment language (e.g., 'English', 'Simplified Chinese', 'Traditional Chinese', 'Japanese', 'Korean'). Default 'English'; empty or unsupported value falls back to English"
        required: false
        type: string
        default: "English"
      prompt:
        description: "Custom review prompt (optional, has default). Language requirement is injected separately based on review_language, not baked into the prompt default."
        required: false
        type: string
        default: |
          Please review this pull request and provide feedback on:
          - Code quality and best practices
          - Potential bugs or issues
          - Performance considerations
          - Security concerns
          - Test coverage

          ## Review principles

          - Choose the most suitable solution for the specific scenario
            - There may be multiple solutions to the same problem; weigh the pros and cons based on the actual use case
            - While implementing requirements, consider future extensibility to minimize maintenance costs and security risks
          - Avoid over-engineering
          - Pursue simple solutions; simplify complex problems
          - Do not add entities unless necessary

          ## Review strategy

          - Default to a code review mindset: prioritize identifying bugs, risks, behavioral regressions, and missing tests
          - Findings must be the primary focus of the response - keep summaries or overviews brief and only after enumerating the issues
          - Present findings first (ordered by severity with file/line references), follow with open questions or assumptions, and offer a change-summary only as a secondary detail
          - If no findings are discovered, state that explicitly and mention any residual risks or testing gaps

          ## TODO Fix List

          The comment must include a `## TODO Fix List` section containing all findings that **require code changes**; content that doesn't need code changes (open questions, assumptions, Requires manual attention) stays out of this section and remains in its own subsections.
          Each TODO is one line in a fixed format (machine-parseable, coding AI can read and claim directly):
          ```
          ## TODO Fix List
          - [ ] **[TODO-1] [P0] `src/app.ts:42`** — Issue summary; Fix requirement: what specifically to change
          - [ ] **[TODO-2] [P1] `src/utils/date.ts:10-15`** — Issue summary; Fix requirement: ...
          ```
          Format rules:
          - IDs are increasing and stable: `TODO-<n>`, no duplicates within a comment
          - Severity grading, ordered by severity: `[P0]` critical bug / security issue; `[P1]` logic risk / behavioral regression; `[P2]` performance issue / missing tests; `[P3]` style suggestion
          - Location wrapped in backticks as `file:line` or `file:line-line`, must come from this PR's diff
          - Each entry is self-contained: issue description + explicit "Fix requirement", coding AI can execute without re-reading other context
          - Checkboxes always start as `- [ ]`; claim/close protocol is not prescribed, decided by the caller and the coding AI
          - The existing "findings first, ordered by severity, `**Issue Title**`" format requirements are retained for analytical content outside the TODO section; each TODO can have corresponding detailed analysis in the findings body, the TODO line itself stays concise
          - If no findings require changes, explicitly note "No code changes required" in the TODO section

          ## Requires manual attention

          After presenting findings, include a "Requires manual attention" section highlighting areas that require careful human review. Focus on:
          - Complex business logic changes that AI cannot fully validate without domain knowledge
          - Security-sensitive code (authentication, authorization, data encryption, input sanitization)
          - Performance-critical sections (database queries, loops, memory allocation)
          - Financial calculations or sensitive data processing
          - Concurrency patterns, race conditions, or distributed system interactions
          - Database schema changes or data migration logic
          - Third-party API integrations or external service dependencies
          - Edge cases and error handling that may have subtle implications
          - Architectural decisions that affect system design
          - Changes to permission/access control logic
          For each item, briefly explain WHY human review is recommended

          ## Output formatting

          - Use `-` for all list items, never use numbered lists like `1.` `2.`
          - Keep all items flat at the same level, no nested lists or sub-items
          - For each finding, use `**Issue Title**` followed by description text on the same or next line
          - Use backticks for file paths, commands, env vars, and code identifiers
          - Code samples or multi-line snippets should be wrapped in fenced code blocks
          - File references should include line numbers when relevant (e.g., `src/app.ts:42`)
          - Tone: collaborative, concise, factual; present tense, active voice

          When reviewing a PR, use gh command to fetch remote content, like GH_PAGER="cat" gh pr view xxx

jobs:
  setup:
    runs-on: ${{ inputs.runs_on }}
    concurrency:
      group: claude-review-setup-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      too_large: ${{ steps.plan.outputs.too_large }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      summary_model: ${{ steps.plan.outputs.summary_model }}
    steps:
      - name: Resolve model matrix & check PR size
        id: plan
        uses: actions/github-script@v9
        with:
          script: |
            // — 1) Model parsing (always executed to ensure matrix is always valid JSON) —
            const MAX_MODELS = 3; // max number of parallel review models
            const rawModels = `${{ inputs.models }}`;
            const singleModel = `${{ inputs.model }}`;
            let models = rawModels.split(',').map(s => s.trim()).filter(Boolean);
            if (models.length <= 1) {
              models = [models[0] ?? singleModel ?? ''];
            }
            if (models.length > MAX_MODELS) {
              core.warning(`Configured ${models.length} models, exceeding limit ${MAX_MODELS}; truncated to the first ${MAX_MODELS}: [${models.slice(0, MAX_MODELS).join(', ')}]`);
              models = models.slice(0, MAX_MODELS);
            }
            const mode = models.length > 1 ? 'multi' : 'single';
            const slugRe = /[^A-Za-z0-9._-]/g;
            const matrix = models.map((m, i) => ({
              model: m,
              slug: `m${i}-` + (m || 'default').replace(slugRe, '-'),
            }));
            const summaryModel = `${{ inputs.summary_model }}`.trim() || models[0];
            core.setOutput('mode', mode);
            core.setOutput('matrix', JSON.stringify(matrix));
            core.setOutput('summary_model', summaryModel);
            core.info(`Resolved mode=${mode}, models=[${models.join(', ')}], summary_model=${summaryModel}`);

            // — 2) PR size check (skip if run_attempt>1; disabled if max_lines=-1) —
            const runAttempt = parseInt('${{ github.run_attempt }}');
            if (runAttempt > 1) {
              core.info(`Manual rerun detected (attempt ${runAttempt}), skipping size check.`);
              core.setOutput('too_large', 'false');
              return;
            }
            const maxLines = parseInt('${{ inputs.max_lines }}');
            if (maxLines === -1) {
              core.info('Size check disabled (max_lines=-1), skipping.');
              core.setOutput('too_large', 'false');
              return;
            }
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const totalLines = pr.additions + pr.deletions;
            core.info(`PR total changed lines: ${totalLines} (additions: ${pr.additions}, deletions: ${pr.deletions})`);
            if (totalLines > maxLines) {
              core.setOutput('too_large', 'true');
              core.warning(`PR changed lines ${totalLines} exceed ${maxLines}; Claude Review skipped. To force execution, manually re-run this workflow.`);
            } else {
              core.setOutput('too_large', 'false');
            }

  review:
    needs: setup
    if: needs.setup.outputs.too_large != 'true'
    runs-on: ${{ inputs.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ matrix.slug }}-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    env:
      ANTHROPIC_BASE_URL: ${{ vars.CODE_REVIEW_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.CODE_REVIEW_API_KEY }}
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: 1
      CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Minimize old Claude comments
        if: needs.setup.outputs.mode == 'single'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });
            const claudeComments = comments.filter(
              (c) =>
                c.user.login.toLowerCase().includes('claude') ||
                (c.user.login === 'github-actions[bot]' && c.body.startsWith('**Claude')),
            );
            for (const comment of claudeComments) {
              await github.graphql(
                `
              mutation($subjectId: ID!, $classifier: ReportedContentClassifiers!) {
                minimizeComment(input: { subjectId: $subjectId, classifier: $classifier }) {
                  minimizedComment {
                    isMinimized
                    minimizedReason
                  }
                }
              }
              `,
                {
                  subjectId: comment.node_id,
                  classifier: 'OUTDATED',
                },
              );
              core.info(`Minimized old Claude comment: ${comment.id}`);
            }

      - name: Detect Claude CLI path
        id: detect
        shell: bash
        run: |
          # Self-hosted runners (esp. Mac) may have minimal PATH; check common locations
          CLAUDE_PATH=""
          for candidate in \
              /opt/homebrew/bin/claude \
              /usr/local/bin/claude \
              "$HOME/.claude/local/claude" \
              "$HOME/.local/bin/claude" \
              "$HOME/.nvm/versions/node"/*/bin/claude \
              "$HOME/.npm-global/bin/claude" \
              "$(command -v claude 2>/dev/null || true)"; do
            if [ -x "$candidate" ]; then
              CLAUDE_PATH="$candidate"
              break
            fi
          done
          if [ -n "$CLAUDE_PATH" ]; then
            echo "claude_path=${CLAUDE_PATH}" >> $GITHUB_OUTPUT
            echo "Claude CLI found at: $CLAUDE_PATH ($($CLAUDE_PATH --version 2>/dev/null || echo 'version unknown'))"
          else
            echo "::warning::Claude CLI not found in PATH or common locations, will attempt install"
            echo "claude_path=" >> $GITHUB_OUTPUT
          fi

      - name: Install Claude CLI if missing
        if: steps.detect.outputs.claude_path == ''
        id: install
        shell: bash
        run: |
          set -e
          # Load nvm if present (Mac self-hosted runners often have minimal PATH)
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            echo "Loaded nvm from $NVM_DIR/nvm.sh"
          fi
          # Add common Homebrew paths to PATH
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          # Try npm install first (works in geo-blocked regions where claude.ai is unavailable)
          CLAUDE_PATH=""
          if command -v npm >/dev/null 2>&1; then
            echo "Trying npm install of @anthropic-ai/claude-code..."
            if npm install -g @anthropic-ai/claude-code 2>&1; then
              for candidate in \
                  /opt/homebrew/bin/claude \
                  /usr/local/bin/claude \
                  "$HOME/.nvm/versions/node"/*/bin/claude \
                  "$HOME/.npm-global/bin/claude" \
                  "$(command -v claude 2>/dev/null || true)"; do
                if [ -x "$candidate" ]; then
                  CLAUDE_PATH="$candidate"
                  break
                fi
              done
              if [ -n "$CLAUDE_PATH" ]; then
                echo "Installed Claude CLI via npm at: $CLAUDE_PATH"
              fi
            else
              echo "npm install failed, will try fallback..."
            fi
          else
            echo "npm not found even after loading nvm/Homebrew paths"
          fi
          # Fall back to official install.sh if npm didn't work
          if [ -z "$CLAUDE_PATH" ]; then
            echo "Falling back to official install.sh (claude.ai)..."
            curl -fsSL https://claude.ai/install.sh | bash
            # install.sh typically places the binary at ~/.claude/local/claude
            CLAUDE_PATH="$HOME/.claude/local/claude"
            if [ ! -x "$CLAUDE_PATH" ]; then
              CLAUDE_PATH=$(command -v claude 2>/dev/null || true)
            fi
          fi
          if [ -z "$CLAUDE_PATH" ]; then
            echo "::error::Failed to locate Claude CLI after install"
            exit 1
          fi
          echo "claude_path=${CLAUDE_PATH}" >> $GITHUB_OUTPUT
          echo "Installed Claude CLI at: $CLAUDE_PATH ($($CLAUDE_PATH --version 2>/dev/null || echo 'version unknown'))"

      - name: Resolve Claude CLI path
        id: resolve
        shell: bash
        run: |
          # Prefer detected path, fall back to install step output
          CLAUDE_PATH="${{ steps.detect.outputs.claude_path }}"
          if [ -z "$CLAUDE_PATH" ]; then
            CLAUDE_PATH="${{ steps.install.outputs.claude_path }}"
          fi
          echo "claude_path=${CLAUDE_PATH}" >> $GITHUB_OUTPUT
          echo "Resolved Claude CLI path: ${CLAUDE_PATH:-<empty>}"

      - name: Automatic PR Review (${{ matrix.model }})
        id: review_1
        uses: anthropics/claude-code-action@v1
        continue-on-error: ${{ needs.setup.outputs.mode == 'multi' }}
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          track_progress: ${{ needs.setup.outputs.mode == 'single' }}
          path_to_claude_code_executable: ${{ steps.resolve.outputs.claude_path }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Before starting your review, run these commands to load context:

            1. Load your last review comment (to avoid repeating findings and build on previous feedback):
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || github.event.issue.number }}/comments --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body'

            2. Load all user comments on this PR (to ensure you don't miss user feedback):
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || github.event.issue.number }}/comments --jq '[.[] | select(.user.login != "github-actions[bot]" and (.user.login | test("claude"; "i") | not) and .user.login != "cycode-security")] | .[] | "--- User: \(.user.login) ---\n\(.body)"'

            ${{ inputs.user_request != '' && format('User request: {0}\n', inputs.user_request) || '' }}

            **CRITICAL - Language Requirement:**
            - All review comments MUST be written in ${{ inputs.review_language || 'English' }}
            - Code snippets, technical terms, and file paths may remain in their original language
            - This is a mandatory requirement and must not be ignored

            ${{ inputs.prompt }}

            ${{ needs.setup.outputs.mode == 'single' && 'Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.' || '' }}${{ needs.setup.outputs.mode == 'multi' && 'IMPORTANT: Do NOT post any comment to the PR. Instead, write your complete review in Markdown to the file `./claude-review-output.md` in the current working directory using the Write tool. The file content must be exactly the review body you would otherwise post, nothing else.' || '' }}
          claude_args: |
            --allowedTools "${{ needs.setup.outputs.mode == 'multi' && 'Write,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh pr checks:*),Bash(gh repo view:*)' || 'mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh pr checks:*),Bash(gh repo view:*)' }}"
            ${{ matrix.model != '' && format('--model {0}', matrix.model) || '' }}

      - name: Relocate execution log
        id: relocate_review_log
        if: always()
        shell: bash
        run: |
          src="${{ steps.review_1.outputs.execution_file }}"
          if [ -z "$src" ] || [ ! -f "$src" ]; then
            echo "No execution file found (steps.review_1.outputs.execution_file empty or missing); skipping"
            echo "dst=" >> $GITHUB_OUTPUT
            exit 0
          fi
          proj_dir=$(ls -td ~/.claude/projects/*/ 2>/dev/null | head -1)
          sid="unknown"
          if [ -n "$proj_dir" ]; then
            latest=$(ls -t "$proj_dir"/*.jsonl 2>/dev/null | head -1)
            [ -n "$latest" ] && sid=$(basename "$latest" .jsonl)
          fi
          dst="/tmp/claude-execution-output-${sid}-${{ github.run_id }}-attempt${{ github.run_attempt }}.json"
          cp "$src" "$dst"
          echo "Copied execution log to $dst"
          echo "dst=$dst" >> $GITHUB_OUTPUT

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-exec-log-${{ matrix.slug }}
          path: /tmp/claude-execution-output-*.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

      - name: Package review output
        if: ${{ !cancelled() && needs.setup.outputs.mode == 'multi' }}
        shell: bash
        run: |
          mkdir -p review-output
          OUT="review-output/${{ matrix.slug }}.md"
          {
            echo "<!-- reviewer-model: ${{ matrix.model }} -->"
            echo "# Reviewer: ${{ matrix.model }}"
            echo
            if [ -f ./claude-review-output.md ]; then
              cat ./claude-review-output.md
            else
              echo "> ⚠️ This model produced no review output (execution failed or did not write to the output file)."
            fi
          } > "$OUT"
          echo "Packaged review output to $OUT"

      - name: Upload review artifact
        if: ${{ !cancelled() && needs.setup.outputs.mode == 'multi' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-${{ matrix.slug }}
          path: review-output/
          retention-days: 7
          overwrite: true

  summarize:
    needs: [setup, review]
    if: ${{ !cancelled() && needs.setup.outputs.too_large != 'true' && needs.setup.outputs.mode == 'multi' }}
    runs-on: ${{ inputs.runs_on }}
    concurrency:
      group: claude-review-summary-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    env:
      ANTHROPIC_BASE_URL: ${{ vars.CODE_REVIEW_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.CODE_REVIEW_API_KEY }}
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: 1
      CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all review artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: claude-review-*
          path: ./claude-reviews
          merge-multiple: true

      - name: Verify review outputs
        id: verify
        shell: bash
        run: |
          set -e
          mkdir -p ./claude-reviews
          COUNT=$(/usr/bin/find ./claude-reviews -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "Collected $COUNT review file(s):"
          ls -la ./claude-reviews/ || true
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::All review jobs produced no output; skipping summary comment."
            exit 1
          fi
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Minimize old Claude comments
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });
            const claudeComments = comments.filter(
              (c) =>
                c.user.login.toLowerCase().includes('claude') ||
                (c.user.login === 'github-actions[bot]' && c.body.startsWith('**Claude')),
            );
            for (const comment of claudeComments) {
              await github.graphql(
                `
              mutation($subjectId: ID!, $classifier: ReportedContentClassifiers!) {
                minimizeComment(input: { subjectId: $subjectId, classifier: $classifier }) {
                  minimizedComment {
                    isMinimized
                    minimizedReason
                  }
                }
              }
              `,
                {
                  subjectId: comment.node_id,
                  classifier: 'OUTDATED',
                },
              );
              core.info(`Minimized old Claude comment: ${comment.id}`);
            }

      - name: Detect Claude CLI path
        id: detect
        shell: bash
        run: |
          # Self-hosted runners (esp. Mac) may have minimal PATH; check common locations
          CLAUDE_PATH=""
          for candidate in \
              /opt/homebrew/bin/claude \
              /usr/local/bin/claude \
              "$HOME/.claude/local/claude" \
              "$HOME/.local/bin/claude" \
              "$HOME/.nvm/versions/node"/*/bin/claude \
              "$HOME/.npm-global/bin/claude" \
              "$(command -v claude 2>/dev/null || true)"; do
            if [ -x "$candidate" ]; then
              CLAUDE_PATH="$candidate"
              break
            fi
          done
          if [ -n "$CLAUDE_PATH" ]; then
            echo "claude_path=${CLAUDE_PATH}" >> $GITHUB_OUTPUT
            echo "Claude CLI found at: $CLAUDE_PATH ($($CLAUDE_PATH --version 2>/dev/null || echo 'version unknown'))"
          else
            echo "::warning::Claude CLI not found in PATH or common locations, will attempt install"
            echo "claude_path=" >> $GITHUB_OUTPUT
          fi

      - name: Install Claude CLI if missing
        if: steps.detect.outputs.claude_path == ''
        id: install
        shell: bash
        run: |
          set -e
          # Load nvm if present (Mac self-hosted runners often have minimal PATH)
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            echo "Loaded nvm from $NVM_DIR/nvm.sh"
          fi
          # Add common Homebrew paths to PATH
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          # Try npm install first (works in geo-blocked regions where claude.ai is unavailable)
          CLAUDE_PATH=""
          if command -v npm >/dev/null 2>&1; then
            echo "Trying npm install of @anthropic-ai/claude-code..."
            if npm install -g @anthropic-ai/claude-code 2>&1; then
              for candidate in \
                  /opt/homebrew/bin/claude \
                  /usr/local/bin/claude \
                  "$HOME/.nvm/versions/node"/*/bin/claude \
                  "$HOME/.npm-global/bin/claude" \
                  "$(command -v claude 2>/dev/null || true)"; do
                if [ -x "$candidate" ]; then
                  CLAUDE_PATH="$candidate"
                  break
                fi
              done
              if [ -n "$CLAUDE_PATH" ]; then
                echo "Installed Claude CLI via npm at: $CLAUDE_PATH"
              fi
            else
              echo "npm install failed, will try fallback..."
            fi
          else
            echo "npm not found even after loading nvm/Homebrew paths"
          fi
          # Fall back to official install.sh if npm didn't work
          if [ -z "$CLAUDE_PATH" ]; then
            echo "Falling back to official install.sh (claude.ai)..."
            curl -fsSL https://claude.ai/install.sh | bash
            # install.sh typically places the binary at ~/.claude/local/claude
            CLAUDE_PATH="$HOME/.claude/local/claude"
            if [ ! -x "$CLAUDE_PATH" ]; then
              CLAUDE_PATH=$(command -v claude 2>/dev/null || true)
            fi
          fi
          if [ -z "$CLAUDE_PATH" ]; then
            echo "::error::Failed to locate Claude CLI after install"
            exit 1
          fi
          echo "claude_path=${CLAUDE_PATH}" >> $GITHUB_OUTPUT
          echo "Installed Claude CLI at: $CLAUDE_PATH ($($CLAUDE_PATH --version 2>/dev/null || echo 'version unknown'))"

      - name: Resolve Claude CLI path
        id: resolve
        shell: bash
        run: |
          # Prefer detected path, fall back to install step output
          CLAUDE_PATH="${{ steps.detect.outputs.claude_path }}"
          if [ -z "$CLAUDE_PATH" ]; then
            CLAUDE_PATH="${{ steps.install.outputs.claude_path }}"
          fi
          echo "claude_path=${CLAUDE_PATH}" >> $GITHUB_OUTPUT
          echo "Resolved Claude CLI path: ${CLAUDE_PATH:-<empty>}"

      - name: Summarize reviews
        id: summarize_1
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          track_progress: true
          path_to_claude_code_executable: ${{ steps.resolve.outputs.claude_path }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are the summarizer for multi-model code review. Multiple AI models have independently completed reviews of this PR; the raw results are saved in the `./claude-reviews/` directory (each `.md` file corresponds to one model; the `# Reviewer: <model>` line at the top of the file identifies the model name).

            Steps:
            1. Use Glob/Read to read all `.md` files under `./claude-reviews/`, extract the model name from each file's `# Reviewer:` header.
            2. You can use `GH_PAGER=cat gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}` to view the actual diff for cross-verifying disputed findings.
            3. Merge all findings and deduplicate: the same issue reported by different models in different wording counts as one entry.
            4. Annotate each finding with a confidence level:
               - Reported independently by ≥2 models → annotate after the title with `[Consensus N/M]` (N = number of models reporting the issue, M = total models); high confidence, ranked first
               - Reported by a single model only → quick-check against the diff; obvious false positives (citing non-existent code, misreading diff context) are discarded outright; unverifiable items are kept and annotated with `[Single model]`
            5. Merge each model's `## TODO Fix List` section: after dedup, **renumber** as continuous `TODO-1..n`, output a unified `## TODO Fix List` (format per the review-guidelines below). Consensus annotation goes after the severity tag on the TODO line, e.g. `- [ ] **[TODO-1] [P0] [Consensus 2/3] \`src/app.ts:42\`** — …`. The original reviews in the collapsed blocks keep their original numbering, but the comment must note that the body TODO list is the only authoritative list.
            6. Order output by severity (critical bug / security issue → logic risk / behavioral regression → performance → missing tests → style suggestion).
            7. Merge each model's "Requires manual attention" into one section, deduplicated.
            8. If a model's file content is the failure placeholder ("No review output"), note at the end of the comment that the model was absent; this doesn't affect the rest of the summary.

            ${{ inputs.user_request != '' && format('User request: {0}\n', inputs.user_request) || '' }}

            **CRITICAL - Language Requirement:**
            - All review comments MUST be written in ${{ inputs.review_language || 'English' }}
            - Code snippets, technical terms, and file paths may remain in their original language
            - This is a mandatory requirement and must not be ignored

            Below are the guidelines for this review; the **language requirement ({{ inputs.review_language || 'English' }}), TODO Fix List format, and Output formatting requirements apply equally to your summary comment**:
            <review-guidelines>
            ${{ inputs.prompt }}
            </review-guidelines>

            Final output requirements:
            - Post **exactly one** PR comment (run `gh pr comment` with the Bash tool); do not post multiple.
            - The first line of the comment states this is a joint review summary from N models (list model names).
            - Comment structure:
              - Opening line stating the list of models in the joint review
              - Merged and deduplicated findings analysis (with confidence annotations, ordered by severity)
              - Unified `## TODO Fix List` (the only authoritative list, continuous numbering TODO-1..n)
              - Merged "Requires manual attention" section
              - Absent-model note (if any)
              - At the bottom, attach each model's original review in a collapsed block, formatted as:
                <details>
                <summary>Original Review: <model-name></summary>
                (Original content. Note: there must be a blank line between the <details> tag and the content for markdown to render correctly.)
                </details>
            - GitHub comment limit is 65536 characters: if the total original reviews are too large, proportionally truncate the collapsed-block content and note "Truncated; full content in workflow artifacts"; the summary body and TODO list must not be truncated.
            - Do not perform any other PR operations beyond this one comment.
          claude_args: |
            --allowedTools "Read,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
            ${{ needs.setup.outputs.summary_model != '' && format('--model {0}', needs.setup.outputs.summary_model) || '' }}

      - name: Relocate execution log (summarize)
        id: relocate_summary_log
        if: always()
        shell: bash
        run: |
          src="${{ steps.summarize_1.outputs.execution_file }}"
          if [ -z "$src" ] || [ ! -f "$src" ]; then
            echo "No execution file found (steps.summarize_1.outputs.execution_file empty or missing); skipping"
            echo "dst=" >> $GITHUB_OUTPUT
            exit 0
          fi
          proj_dir=$(ls -td ~/.claude/projects/*/ 2>/dev/null | head -1)
          sid="unknown"
          if [ -n "$proj_dir" ]; then
            latest=$(ls -t "$proj_dir"/*.jsonl 2>/dev/null | head -1)
            [ -n "$latest" ] && sid=$(basename "$latest" .jsonl)
          fi
          dst="/tmp/claude-execution-output-${sid}-${{ github.run_id }}-summary-attempt${{ github.run_attempt }}.json"
          cp "$src" "$dst"
          echo "Copied execution log to $dst"
          echo "dst=$dst" >> $GITHUB_OUTPUT

      - name: Upload execution log (summarize)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-exec-log-summary
          path: /tmp/claude-execution-output-*.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
