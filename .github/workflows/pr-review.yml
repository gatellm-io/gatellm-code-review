# Auto-review for this repo's own PRs.
# Calls the local reusable workflow (.github/workflows/claude-auto-review.yml).
# Triggers: PR open/synchronize/reopen, and @claude mentions in PR comment threads.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude-review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '@claude'))
    uses: ./.github/workflows/claude-auto-review.yml
    secrets: inherit
    with:
      runs_on: "code-review"
