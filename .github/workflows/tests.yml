name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve-max-context-tokens:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run max_context_tokens resolution tests
        run: |
          # Exercise the exact shell the action sees on macOS self-hosted
          # runners (`shell: bash` -> /bin/bash 3.2), not Homebrew's bash.
          # BASH_BIN is exported so the test reuses it for the extracted block.
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            export BASH_BIN=/bin/bash
          else
            export BASH_BIN=bash
          fi
          "$BASH_BIN" tests/resolve-max-context-tokens.sh
